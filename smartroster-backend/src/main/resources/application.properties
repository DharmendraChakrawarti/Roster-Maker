spring.application.name=SmartRoster
server.port=8080

# Database Configuration (Defaults to embedded PostgreSQL-compatible DB with zero-setup instant run, or PostgreSQL if environment variables are set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartroster;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:8080

# Logging
logging.level.com.smartroster=INFO
logging.level.org.springframework.web=INFO
